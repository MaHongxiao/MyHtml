<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>认证线运营驾驶舱 - 认证线全景模块</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            min-width: 1920px;
            min-height: 1080px;
        }
        
        .screen-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(ellipse at center, #0f1535 0%, #0a0e27 100%);
            overflow: hidden;
        }
        
        .bg-decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 86, 179, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 86, 179, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 86, 179, 0.15) 0%, transparent 70%);
            top: -300px;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(40px);
        }
        
        /* 顶部控制栏 */
        .control-bar {
            height: 80px;
            background: rgba(15, 21, 53, 0.9);
            border-bottom: 2px solid rgba(0, 86, 179, 0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
        }
        
        .control-bar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .control-bar-logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #0056b3, #FFD700);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
        }
        
        .control-bar-title {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(90deg, #fff, #7eb8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .control-bar-subtitle {
            font-size: 14px;
            color: #7eb8ff;
            margin-left: 15px;
        }
        
        .control-bar-filter {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .control-bar-label {
            color: #7eb8ff;
            font-size: 14px;
        }
        
        .year-select {
            padding: 8px 15px;
            background: rgba(0, 86, 179, 0.3);
            border: 1px solid rgba(0, 86, 179, 0.5);
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
        
        .year-select option {
            background: #0a0e27;
            color: #fff;
        }
        
        .filter-select {
            padding: 6px 10px;
            background: rgba(0, 86, 179, 0.4);
            border: 1px solid rgba(0, 134, 255, 0.6);
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .filter-select:hover {
            background: rgba(0, 86, 179, 0.6);
            border-color: rgba(0, 134, 255, 0.8);
        }
        
        .filter-select:focus {
            background: rgba(0, 86, 179, 0.7);
            border-color: #0086ff;
            box-shadow: 0 0 8px rgba(0, 134, 255, 0.4);
        }
        
        .filter-select option {
            background: #0a1a3a;
            color: #fff;
            padding: 8px;
        }
        

        
        /* 地图返回按钮 */
        .map-back-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 6px 15px;
            background: linear-gradient(135deg, #0056b3 0%, #003d82 100%);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            z-index: 100;
            display: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        
        .map-back-btn:hover {
            background: linear-gradient(135deg, #FFD700 0%, #b39700 100%);
            color: #000;
        }
        
        /* 主内容区左右布局 */
        .main-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        .main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 25px 30px;
            position: relative;
            z-index: 5;
        }

        .main-content::-webkit-scrollbar {
            width: 6px;
        }

        .main-content::-webkit-scrollbar-track {
            background: rgba(0, 86, 179, 0.1);
            border-radius: 4px;
        }

        .main-content::-webkit-scrollbar-thumb {
            background: rgba(0, 86, 179, 0.5);
            border-radius: 4px;
        }

        /* 右侧AI助手区域 - 占22% */
        .ai-panel {
            width: 22%;
            min-width: 320px;
            height: 100%;
            background: rgba(15, 21, 53, 0.95);
            border-left: 2px solid rgba(0, 86, 179, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.3);
        }
        
        .ai-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #0056b3, #FFD700, #0056b3, transparent);
        }
        
        .ai-header {
            padding: 15px 20px;
            background: rgba(0, 86, 179, 0.2);
            border-bottom: 1px solid rgba(0, 86, 179, 0.3);
        }
        
        .ai-title {
            font-size: 16px;
            font-weight: bold;
            color: #FFD700;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        
        .ai-title::before {
            content: '🤖';
            font-size: 20px;
        }
        
        .ai-subtitle {
            font-size: 11px;
            color: #7eb8ff;
            line-height: 1.4;
        }
        
        .ai-chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .ai-chat::-webkit-scrollbar {
            width: 4px;
        }
        
        .ai-chat::-webkit-scrollbar-track {
            background: rgba(0, 86, 179, 0.1);
            border-radius: 4px;
        }
        
        .ai-chat::-webkit-scrollbar-thumb {
            background: rgba(0, 86, 179, 0.5);
            border-radius: 4px;
        }
        
        .ai-message {
            display: flex;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .ai-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #0056b3 0%, #003d82 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            border: 2px solid #FFD700;
        }
        
        .ai-bubble {
            background: rgba(0, 86, 179, 0.2);
            border: 1px solid rgba(0, 86, 179, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
            max-width: calc(100% - 50px);
            font-size: 12px;
            line-height: 1.5;
            color: #e6f7ff;
            position: relative;
        }
        
        .ai-bubble::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 12px;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-right: 5px solid rgba(0, 86, 179, 0.3);
        }
        
        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .user-bubble {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.3);
            color: #fff;
        }
        
        .user-bubble::before {
            left: auto;
            right: -5px;
            border-right: none;
            border-left: 5px solid rgba(255, 215, 0, 0.3);
        }
        
        .ai-input-area {
            padding: 12px 15px;
            background: rgba(0, 86, 179, 0.15);
            border-top: 1px solid rgba(0, 86, 179, 0.3);
        }
        
        .ai-input-wrapper {
            display: flex;
            gap: 8px;
            background: rgba(10, 14, 39, 0.6);
            border: 1px solid rgba(0, 86, 179, 0.3);
            border-radius: 20px;
            padding: 4px;
        }
        
        .ai-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 8px 12px;
            font-size: 13px;
        }
        
        .ai-input::placeholder {
            color: rgba(126, 184, 255, 0.5);
        }
        
        .ai-send-btn {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #0056b3 0%, #003d82 100%);
            border: none;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 16px;
        }
        
        .ai-send-btn:hover {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        
        .ai-quick-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        
        .quick-btn {
            padding: 5px 10px;
            background: rgba(0, 86, 179, 0.2);
            border: 1px solid rgba(0, 86, 179, 0.3);
            border-radius: 12px;
            color: #7eb8ff;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .quick-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #FFD700;
            color: #FFD700;
        }
        
        /* 维度标题 */
        .dimension-section {
            margin-bottom: 35px;
        }
        
        .dimension-title {
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 20px;
            padding: 12px 20px;
            background: linear-gradient(90deg, rgba(0, 86, 179, 0.3), transparent);
            border-left: 4px solid #FFD700;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: space-between;
        }
        
        .dimension-title span {
            font-size: 14px;
            color: #7eb8ff;
            font-weight: normal;
        }
        
        .dimension-title .data-date {
            font-size: 13px;
            color: #b0c4de;
            font-weight: normal;
            margin-left: auto;
        }
        
        /* KPI卡片 */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        /* 6个指标卡的特殊布局 */
        .kpi-grid-6 {
            grid-template-columns: repeat(6, 1fr);
        }

        .kpi-grid-6 .kpi-card {
            min-width: 160px;
        }

        .kpi-card {
            background: rgba(0, 86, 179, 0.15);
            border: 1px solid rgba(0, 86, 179, 0.3);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .kpi-card:hover::before {
            opacity: 1;
        }
        
        .kpi-card:hover {
            background: rgba(0, 86, 179, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 86, 179, 0.3);
        }
        
        .kpi-label {
            font-size: 14px;
            color: #7eb8ff;
            margin-bottom: 10px;
        }
        
        .kpi-value {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }
        
        .kpi-unit {
            font-size: 13px;
            color: #7eb8ff;
            margin-left: 5px;
        }
        
        .kpi-trend {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .kpi-trend.up {
            color: #52c41a;
        }
        
        .kpi-trend.down {
            color: #f5222d;
        }
        
        /* 图表面板 */
        .charts-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 25px;
        }
        
        .charts-row-2 {
            grid-template-columns: repeat(2, 1fr);
        }
        
        .panel {
            background: rgba(0, 86, 179, 0.1);
            border: 1px solid rgba(0, 86, 179, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .panel-header {
            padding: 15px 20px;
            background: rgba(0, 86, 179, 0.2);
            border-bottom: 1px solid rgba(0, 86, 179, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .panel-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }
        
        .panel-subtitle {
            font-size: 12px;
            color: #7eb8ff;
            background: rgba(0, 86, 179, 0.3);
            padding: 3px 10px;
            border-radius: 4px;
        }
        
        /* 时间切换 tabs */
        .time-tabs {
            display: flex;
            gap: 5px;
            margin-left: auto;
        }
        
        .time-tab {
            padding: 4px 10px;
            font-size: 11px;
            color: #7eb8ff;
            background: rgba(0, 86, 179, 0.2);
            border: 1px solid rgba(0, 86, 179, 0.3);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .time-tab:hover {
            background: rgba(0, 86, 179, 0.4);
            color: #fff;
        }
        
        .time-tab.active {
            background: linear-gradient(135deg, #0056b3 0%, #4da6ff 100%);
            color: #fff;
            border-color: #4da6ff;
            font-weight: bold;
        }
        
        .panel-content {
            padding: 20px;
            height: 320px;
        }

        .chart-container {
            width: 100%;
            height: 100%;
        }

        /* 预警列表样式 */
        .warning-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .warning-item {
            padding: 16px 18px;
            border-radius: 8px;
            border: 1px solid rgba(0, 86, 179, 0.3);
            background: linear-gradient(135deg, rgba(0, 86, 179, 0.15) 0%, rgba(0, 86, 179, 0.05) 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .warning-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, #0056b3, #4da6ff);
            opacity: 0.8;
        }

        .warning-item:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, rgba(0, 86, 179, 0.25) 0%, rgba(0, 86, 179, 0.1) 100%);
            box-shadow: 0 4px 12px rgba(0, 86, 179, 0.2);
        }

        .warning-item.high {
            border-color: rgba(245, 34, 45, 0.4);
            background: linear-gradient(135deg, rgba(245, 34, 45, 0.12) 0%, rgba(245, 34, 45, 0.03) 100%);
        }

        .warning-item.high::before {
            background: linear-gradient(180deg, #f5222d, #ff7875);
        }

        .warning-item.medium {
            border-color: rgba(250, 173, 20, 0.4);
            background: linear-gradient(135deg, rgba(250, 173, 20, 0.12) 0%, rgba(250, 173, 20, 0.03) 100%);
        }

        .warning-item.medium::before {
            background: linear-gradient(180deg, #faad14, #ffc53d);
        }

        .warning-item.low {
            border-color: rgba(82, 196, 26, 0.4);
            background: linear-gradient(135deg, rgba(82, 196, 26, 0.12) 0%, rgba(82, 196, 26, 0.03) 100%);
        }

        .warning-item.low::before {
            background: linear-gradient(180deg, #52c41a, #95de64);
        }

        .warning-item.info {
            border-color: rgba(24, 144, 255, 0.4);
            background: linear-gradient(135deg, rgba(24, 144, 255, 0.12) 0%, rgba(24, 144, 255, 0.03) 100%);
        }

        .warning-item.info::before {
            background: linear-gradient(180deg, #1890ff, #69c0ff);
        }

        .warning-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .warning-rank {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1px 6px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            font-size: 10px;
            font-weight: bold;
            border-radius: 3px;
            min-width: 36px;
            height: 18px;
        }

        .warning-rank-change {
            font-size: 10px;
            color: rgba(126, 184, 255, 0.8);
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid rgba(0, 86, 179, 0.2);
        }

        .warning-rank-change-text {
            font-weight: bold;
        }

        .warning-rank-change-text.up {
            color: #52c41a;
        }

        .warning-rank-change-text.down {
            color: #f5222d;
        }

        .warning-rank-change-text.stable {
            color: #7eb8ff;
        }

        .warning-content {
            font-size: 13px;
            color: rgba(126, 184, 255, 0.9);
            line-height: 1.5;
        }

        .warning-value {
            color: #FFD700;
            font-weight: bold;
            font-size: 14px;
        }

        .warning-trend {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 6px;
        }

        .warning-trend.up {
            color: #f5222d;
            background: rgba(245, 34, 45, 0.15);
        }

        .warning-trend.down {
            color: #52c41a;
            background: rgba(82, 196, 26, 0.15);
        }

        .warning-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(126, 184, 255, 0.6);
            font-size: 12px;
            font-style: italic;
        }

        /* 预警模块填充布局 */
        .warning-row {
            height: 380px;
        }

        .warning-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .warning-panel-wide {
            display: flex;
            flex-direction: column;
            height: 100%;
            grid-column: span 2;
        }

        .warning-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .warning-panel-content::-webkit-scrollbar {
            width: 6px;
        }

        .warning-panel-content::-webkit-scrollbar-track {
            background: rgba(0, 86, 179, 0.1);
            border-radius: 3px;
        }

        .warning-panel-content::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #0056b3, #4da6ff);
            border-radius: 3px;
        }

        .warning-panel-content::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #4da6ff, #0056b3);
        }

        /* 新兴业务弹框滚动条样式 */
        #emergingBusinessModal > div::-webkit-scrollbar {
            width: 8px;
        }

        #emergingBusinessModal > div::-webkit-scrollbar-track {
            background: rgba(0, 86, 179, 0.1);
            border-radius: 4px;
        }

        #emergingBusinessModal > div::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #0056b3, #4da6ff);
            border-radius: 4px;
        }

        #emergingBusinessModal > div::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #4da6ff, #0056b3);
        }

        .warning-list-fill {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 100%;
        }

        /* 竞争对手预警两列布局 */
        .competitor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            min-height: 100%;
        }

        .competitor-grid .warning-item {
            height: 100%;
        }

        .warning-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #7eb8ff;
            font-size: 14px;
            gap: 10px;
        }

        .warning-empty .icon {
            font-size: 48px;
            opacity: 0.5;
        }

        /* 分类标签 */
        .category-label {
            font-size: 16px;
            margin: 20px 0 15px;
            padding: 10px 15px;
            background: rgba(0, 86, 179, 0.1);
            border-radius: 5px;
            border-left: 3px solid #52c41a;
            font-weight: bold;
            color: lab(100% 0.01 -0.01);
        }
        
        /* 加载提示 */
        .loading-tip {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #7eb8ff;
            font-size: 14px;

// 更新省份选择器显示状态和选项
function updateProvinceSelect(regionName) {
    const provinceSelect = document.getElementById('provinceSelect');
    const provinceLabel = document.getElementById('provinceLabel');

    if (!provinceSelect || !provinceLabel) return;

    if (regionName === 'all' || regionName === '海外区域' || !provinceMapping[regionName]) {
        // 隐藏省份选择器
        provinceSelect.style.display = 'none';
        provinceLabel.style.display = 'none';
        provinceSelect.innerHTML = '<option value="">全部</option>';
        return;
    }

    // 显示省份选择器
    provinceSelect.style.display = 'inline-block';
    provinceLabel.style.display = 'inline-block';

    // 更新省份选项
    const provinces = provinceMapping[regionName] || [];
    let options = '<option value="">全部</option>';
    provinces.forEach(province => {
        options += `<option value="${province}">${province}</option>`;
    });
    provinceSelect.innerHTML = options;
}

// 切换省份
function switchProvince(provinceName) {
    if (!provinceName) return;

    currentProvince = provinceName;

    } else {

    }
};

        // 生成KPI卡片
        function generateKPICard(label, data) {
            const trendIcon = data.trend > 0 ? '↑' : '↓';
            const trendClass = data.trend > 0 ? 'up' : 'down';
            const trendText = data.trend > 0 ? `+${data.trend}%` : `${data.trend}%`;

            // 序时进度特殊处理：显示进度条+百分比（不显示数值）
            if (label.includes('序时进度')) {
                const progressValue = data.value;
                const progressColor = progressValue >= 100 ? '#52c41a' : progressValue >= 80 ? '#FFD700' : '#ff4d4f';
                return `
                    <div class="kpi-card">
                        <div class="kpi-label">${label}</div>
                        <div class="kpi-progress-container" style="margin-top: 15px;">
                            <div class="kpi-progress-bar" style="height: 8px; background: rgba(0,86,179,0.2); border-radius: 4px; overflow: hidden;">
                                <div class="kpi-progress-fill" style="width: ${Math.min(progressValue, 100)}%; height: 100%; background: linear-gradient(90deg, ${progressColor}, ${progressColor}dd); border-radius: 4px; transition: width 0.5s ease;"></div>
                            </div>
                            <div class="kpi-progress-text" style="display: flex; justify-content: space-between; margin-top: 4px; font-size: 12px;">
                                <span style="color: ${progressColor}; font-weight: bold;">${progressValue}%</span>
                            </div>
                        </div>
                        <div class="kpi-trend ${trendClass}" style="margin-top: 6px;">
                            <span>${trendIcon}</span>
                            <span>${trendText} 同比</span>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="kpi-card">
                    <div class="kpi-label">${label}</div>
                    <div class="kpi-value">
                        ${data.value.toLocaleString()}
                        <span class="kpi-unit">${data.unit}</span>
                    </div>
                    <div class="kpi-trend ${trendClass}">
                        <span>${trendIcon}</span>
                        <span>${trendText} 同比</span>
                    </div>
                </div>
            `;
        }

        function findRegionByProvince(provinceName) {
            for (const [region, provinces] of Object.entries(regionMapping)) {

                    return region;
                }
            }

        // 计算区域汇总数据
        function calculateRegionData() {
            const provinceData = provinceRevenueData[currentYear] || provinceRevenueData['2024'];
            const regionData = {};
            
            // 初始化区域数据
            Object.keys(regionMapping).forEach(region => {
                regionData[region] = {
                    name: region,
                    value: 0,
                    profit: 0,
                    revenueProgress: 0,
                    profitProgress: 0,
                    margin: 0,
                    // 新增指标：当天新增证书数及增长幅度
                    newCertsToday: 0,
                    newCertsGrowth: 0,
                    // 新增指标：当天新增客户数及增长幅度
                    newCustomersToday: 0,
                    newCustomersGrowth: 0,
                    // 新增指标：多体系指数
                    multiSystemIndex: 0,
                    provinces: []
                };
            });
            
            // 汇总各省份数据到区域
            provinceData.forEach(province => {
                const regionName = findRegionByProvince(province.name);
                if (regionName && regionData[regionName]) {
                    regionData[regionName].value += province.value;
                    regionData[regionName].profit += parseFloat(province.profit);
                    regionData[regionName].provinces.push(province.name);
                }
            });
            
            // 计算区域平均值及新增指标
            Object.keys(regionData).forEach(region => {
                const r = regionData[region];
                if (r.provinces.length > 0) {
                    r.revenueProgress = (60 + Math.random() * 35).toFixed(1);
                    r.profitProgress = (55 + Math.random() * 35).toFixed(1);
                    r.margin = ((r.profit / r.value) * 100).toFixed(1);
                    // 新增指标数据（模拟数据）
                    r.newCertsToday = Math.floor(50 + Math.random() * 200);
                    r.newCertsGrowth = (5 + Math.random() * 20).toFixed(1);
                    r.newCustomersToday = Math.floor(10 + Math.random() * 50);
                    r.newCustomersGrowth = (3 + Math.random() * 15).toFixed(1);
                    r.multiSystemIndex = (2.0 + Math.random() * 1.5).toFixed(2);
                }
            });
            
            return Object.values(regionData).filter(r => r.value > 0);
        }

                { name: '浙江省', factor: 1.6 }, { name: '安徽省', factor: 0.8 },
                { name: '福建省', factor: 0.9 }, { name: '江西省', factor: 0.6 },
                { name: '山东省', factor: 1.5 }, { name: '河南省', factor: 1.0 },

                { name: '广东省', factor: 2.2 }, { name: '广西壮族自治区', factor: 0.6 },
                { name: '海南省', factor: 0.4 }, { name: '四川省', factor: 1.0 },

                { name: '宁夏回族自治区', factor: 0.3 }, { name: '新疆维吾尔自治区', factor: 0.4 },
                { name: '内蒙古自治区', factor: 0.5 }
            ];

            return provinces.map(p => {
                const value = Math.round(baseValue * p.factor / provinces.length);
                return { name: p.name, value: value };
            });
        }

        // 计算市场全景区域数据
        function calculateMarketRegionData(provinceData) {
            const regionData = {};
            
            // 初始化区域数据
            Object.keys(regionMapping).forEach(region => {
                regionData[region] = {
                    name: region,
                    value: 0,
                    provinces: []
                };
            });
            
            // 汇总各省份数据到区域
            provinceData.forEach(province => {
                const regionName = findRegionByProvince(province.name);
                if (regionName && regionData[regionName]) {
                    regionData[regionName].value += province.value;
                    regionData[regionName].provinces.push(province.name);
                }
            });
            
            return Object.values(regionData);
        }

        // 生成省份数据
        function generateProvinceData(baseValue) {
            const provinces = [
                '北京', '天津', '上海', '重庆', '河北', '山西', '辽宁', '吉林', '黑龙江',
                '江苏', '浙江', '安徽', '福建', '江西', '山东', '河南', '湖北', '湖南',
                '广东', '海南', '四川', '贵州', '云南', '陕西', '甘肃', '青海', '台湾',
                '内蒙古', '广西', '西藏', '宁夏', '新疆', '香港', '澳门'
            ];

            return provinces.map(name => {
                // 根据省份随机分配不同比例的数据
                const factor = 0.5 + Math.random() * 1.5;
                const value = Math.round(baseValue * factor / provinces.length);
                return { name, value };
            });
        }

        // 当前时间周期（月度/季度/半年/年度）
        let currentTimePeriod = 'month';
        
        // 时间周期配置
        const timePeriodConfig = {
            month: { label: '月度', divisor: 1, xAxisData: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'] },
            quarter: { label: '季度', divisor: 3, xAxisData: ['Q1', 'Q2', 'Q3', 'Q4'] },
            half: { label: '半年', divisor: 6, xAxisData: ['上半年', '下半年'] },
            year: { label: '年度', divisor: 12, xAxisData: ['全年'] }
        };
        
        // 获取近5个时间点的X轴数据
        function getTimeAxisData(period) {
            const currentYear = new Date().getFullYear();
            
            switch(period) {
                case 'year':
                    // 近5年：2020-2024
                    return ['2020年', '2021年', '2022年', '2023年', '2024年'];
                case 'half':
                    // 近5个半年：2023上半年、2023下半年、2024上半年、2024下半年、2025上半年
                    return ['2023上', '2023下', '2024上', '2024下', '2025上'];
                case 'quarter':
                    // 近5个季度：2024Q1-Q4、2025Q1
                    return ['2024Q1', '2024Q2', '2024Q3', '2024Q4', '2025Q1'];
                case 'month':
                default:
                    // 月度保持12个月
                    return ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
            }
        }
        
        // 生成近5个时间点的模拟数据
        function generateTimeSeriesData(baseValue, period) {
            const count = period === 'month' ? 12 : 5;
            const data = [];
            for (let i = 0; i < count; i++) {
                const factor = 0.8 + Math.random() * 0.4;
                data.push(Math.round(baseValue * factor * 100) / 100);
            }
            return data;
        }
        
        // 根据时间周期转换数据
        function convertDataByPeriod(monthlyData, period) {
            const config = timePeriodConfig[period];
            if (!config || period === 'month') return monthlyData;
            
            const result = [];
            const chunkSize = config.divisor;
            
            for (let i = 0; i < monthlyData.length; i += chunkSize) {
                const chunk = monthlyData.slice(i, i + chunkSize);
                const sum = chunk.reduce((a, b) => a + b, 0);
                result.push(Math.round(sum * 100) / 100);
            }
            
            return result;
        }
        
        // 初始化时间切换 tabs
        function initTimeTabs() {
            document.querySelectorAll('.time-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    const chartId = this.dataset.chart;
                    const period = this.dataset.period;
                    
                    // 更新 tab 状态
                    document.querySelectorAll(`.time-tab[data-chart="${chartId}"]`).forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 更新全局时间周期变量
                    currentTimePeriod = period;
                    
                    // 更新图表
                    updateChartByPeriod(chartId, period);
                    
                    // 如果是地图，更新标题
                    if (chartId === 'chartRevenueMap' || chartId === 'mapMarketPanorama') {
                        updateMapTitle(chartId, period);
                    }
                });
            });
        }

            if (!chart) return;
            
            const periodLabels = {

        // 根据时间周期更新图表
        function updateChartByPeriod(chartId, period) {
            const chart = charts[chartId];
            if (!chart) return;
            
            const option = chart.getOption();
            if (!option || !option.series || !option.series[0]) return;
            
            const chartType = option.series[0].type;
            const xAxisData = option.xAxis && option.xAxis[0] ? option.xAxis[0].data : [];
            
            // 检查是否是时间序列图（X轴是月份数据或已有近5个时间点）
            const isTimeSeries = xAxisData.length === 12 && xAxisData[0] === '1月' || 
                                (xAxisData.length === 5 && (xAxisData[0].includes('年') || xAxisData[0].includes('Q') || xAxisData[0].includes('上') || xAxisData[0].includes('下')));
            
            // 处理标准技术引领图表的特殊情况（只支持半年和年度）
            if (chartId === 'chartStandardTech') {
                // 获取当前年份的数据
                const currentYear = new Date().getFullYear();
                let xAxisData, seriesData;
                
                if (period === 'half') {
                    // 半年度：近5个半年
                    xAxisData = ['2023上', '2023下', '2024上', '2024下', '2025上'];
                    // 基于mock数据生成半年度数据
                    const baseYearly = [128, 142, 156];
                    seriesData = baseYearly.flatMap(year => {
                        const half1 = Math.round(year * 0.45);
                        const half2 = year - half1;
                        return [half1, half2];
                    }).slice(-5);
                } else if (period === 'year') {
                    // 年度：近5年
                    xAxisData = ['2021年', '2022年', '2023年', '2024年', '2025年'];
                    seriesData = [110, 128, 142, 156, 168];
                } else {
                    // 不支持月度、季度，默认使用半年
                    xAxisData = ['2023上', '2023下', '2024上', '2024下', '2025上'];
                    const baseYearly = [128, 142, 156];
                    seriesData = baseYearly.flatMap(year => {
                        const half1 = Math.round(year * 0.45);
                        const half2 = year - half1;
                        return [half1, half2];
                    }).slice(-5);
                }
                
                chart.setOption({
                    xAxis: { data: xAxisData },
                    series: [{ data: seriesData }]
                });
                return;
            }
            
            // 处理营业收入时序图的特殊情况
            if (chartId === 'chartRevenue') {
                // 重新创建图表以应用新的时间维度
                createRevenueChart(period);
                return;
            }
            
            // 处理资质能力统计图表的特殊情况
            if (chartId === 'chartQualification') {
                // 重新创建图表以应用新的时间维度
                createQualificationChart(null, period);
                return;
            }
            
            // 获取新的X轴数据（近5个时间点）
            const newXAxisData = getTimeAxisData(period);
            
            // 处理地图类型 - 地图使用geo配置，需要根据时间周期调整数据值
            if (chartType === 'map') {
                // 根据时间周期计算调整因子
                const factor = period === 'month' ? 1 : period === 'quarter' ? 3 : period === 'half' ? 6 : 12;
                
                const newSeries = option.series.map(series => {
                    const originalData = series.data || [];
                    // 调整每个省份/区域的数值
                    const newData = originalData.map(item => ({
                        ...item,
                        value: Math.round((item.value || 0) * factor * (0.9 + Math.random() * 0.2))
                    }));
                    return { data: newData };
                });
                
                // 同时更新visualMap的最大最小值
                const values = newSeries[0].data.map(item => item.value || 0);
                const maxValue = Math.max(...values);
                const minValue = Math.min(...values);
                
                chart.setOption({
                    series: newSeries,
                    visualMap: {
                        max: maxValue,
                        min: minValue
                    }
                });
                return;
            }
            
            // 处理饼图类型 - 饼图没有时间轴，只更新数据值
            if (chartType === 'pie') {
                // 对于饼图，根据时间周期调整数据值（模拟不同时间的数据变化）
                const newSeries = option.series.map(series => {
                    const originalData = series.data;
                    // 根据时间周期调整数值
                    const factor = period === 'month' ? 1 : period === 'quarter' ? 3 : period === 'half' ? 6 : 12;
                    const newData = originalData.map(item => ({
                        ...item,
                        value: Math.round(item.value * factor * (0.9 + Math.random() * 0.2))
                    }));
                    return { data: newData };
                });
                
                chart.setOption({ series: newSeries });
                return;
            }
            
            // 处理非时间序列的分类图表（如行业分布）- 只更新数据值，不改变X轴
            if (!isTimeSeries && chartType === 'bar') {
                const newSeries = option.series.map(series => {
                    const originalData = series.data;
                    // 根据时间周期调整数值
                    const factor = period === 'month' ? 1 : period === 'quarter' ? 3 : period === 'half' ? 6 : 12;
                    const newData = originalData.map(value => Math.round(value * factor * (0.9 + Math.random() * 0.2)));
                    return { data: newData };
                });
                
                chart.setOption({ series: newSeries });
                return;
            }
            
            // 处理时间序列图表（柱形图、折线图等）- 生成近5个时间点的数据
            const dataLength = period === 'month' ? 12 : 5;
            const newSeries = option.series.map(series => {
                const baseValue = series.data.reduce((a, b) => a + b, 0) / series.data.length;
                const newData = generateTimeSeriesData(baseValue, period);
                return { data: newData };
            });
            
            // 更新图表
            chart.setOption({
                xAxis: {
                    data: newXAxisData
                },
                series: newSeries
            });
        }

        // 从GeoJSON生成城市数据
        function generateCityDataFromGeoJSON(geoJson, provinceName) {
            // 从GeoJSON中提取所有行政区划名称
            const features = geoJson.features || [];
            const cityNames = features.map(f => f.properties.name).filter(name => name);
            
            // 根据省份总营收分配给各个行政区划
            const baseValue = provinceRevenueData[currentYear]?.find(p => p.name === provinceName)?.value || 100;
            
            return cityNames.map((cityName, index) => {
                // 根据城市位置分配不同的权重（模拟真实分布）
                const weight = 0.05 + Math.random() * 0.25;
                const value = baseValue * weight;
                const detail = generateProvinceDetailData(value);
                return {
                    name: cityName,
                    value: parseFloat(value.toFixed(1)),
                    ...detail
                };
            });
        }

        // 初始化预警信息模块
        function initWarningModule(warningData) {
            if (!warningData) return;

            // 序时进度预警
            renderScheduleProgressWarning(warningData.scheduleProgress);

            // 有效证书增减预警
            renderCertChangeWarning(warningData.certChange);

            // 业务营收结构预警
            renderRevenueStructureWarning(warningData.revenueStructure);

            // 流失预警
            renderChurnWarning(warningData.churn);

            // 竞争对手预警
            renderCompetitorWarning(warningData.competitors);

        // 渲染序时进度预警
        function renderScheduleProgressWarning(data) {
            const container = document.getElementById('warningScheduleProgress');
            if (!container || !data) return;

            let html = '';

            // 区域序时进度 - 显示所有区域
            data.regionProgress.forEach(region => {
                const diff = region.value - region.target;
                const isBelowTarget = diff < 0;
                html += `
                    <div class="warning-item ${region.status}">
                        <div class="warning-title">
                            ${region.name}
                        </div>
                        <div class="warning-content">
                            当前进度 <span class="warning-value">${region.value}%</span>，
                            目标 <span class="warning-value">${region.target}%</span>
                            <span class="warning-trend ${isBelowTarget ? 'up' : 'down'}">
                                ${isBelowTarget ? '↓' : '↑'} ${Math.abs(diff).toFixed(1)}%
                            </span>
                        </div>
                    </div>
                `;
            });

            if (html === '') {
                html += `
                    <div class="warning-empty">
                        <span>所有区域序时进度正常</span>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

                            上月 <span class="warning-value">${data.traditional.lastMonth}</span> 亿元
                            <span class="warning-trend ${data.traditional.change >= 0 ? 'down' : 'up'}">
                                ${data.traditional.change >= 0 ? '↑' : '↓'} ${Math.abs(data.traditional.change).toFixed(2)}%
                            </span>
                        </div>
                    </div>
                `;
            }

            // 海外业务营收
            if (data.overseas) {
                html += `
                    <div class="warning-item ${data.overseas.status}">
                        <div class="warning-title">
                            海外业务营收
                        </div>
                        <div class="warning-content">
                            本月 <span class="warning-value">${data.overseas.current}</span> 亿元，
                            上月 <span class="warning-value">${data.overseas.lastMonth}</span> 亿元
                            <span class="warning-trend ${data.overseas.change >= 0 ? 'down' : 'up'}">
                                ${data.overseas.change >= 0 ? '↑' : '↓'} ${Math.abs(data.overseas.change).toFixed(1)}%
                            </span>
                        </div>
                    </div>
                `;
            }

            // 国内业务营收
            if (data.domestic) {
                html += `
                    <div class="warning-item ${data.domestic.status}">
                        <div class="warning-title">
                            国内业务营收
                        </div>
                        <div class="warning-content">
                            本月 <span class="warning-value">${data.domestic.current}</span> 亿元，
                            上月 <span class="warning-value">${data.domestic.lastMonth}</span> 亿元
                            <span class="warning-trend ${data.domestic.change >= 0 ? 'down' : 'up'}">
                                ${data.domestic.change >= 0 ? '↑' : '↓'} ${Math.abs(data.domestic.change).toFixed(2)}%
                            </span>
                        </div>
                    </div>
                `;
            }

            // 新业务营收
            if (data.newBusiness) {
                html += `
                    <div class="warning-item ${data.newBusiness.status}">
                        <div class="warning-title">
                            新签业务营收
                        </div>
                        <div class="warning-content">
                            本月 <span class="warning-value">${data.newBusiness.current}</span> 亿元，
                            上月 <span class="warning-value">${data.newBusiness.lastMonth}</span> 亿元
                            <span class="warning-trend ${data.newBusiness.change >= 0 ? 'down' : 'up'}">
                                ${data.newBusiness.change >= 0 ? '↑' : '↓'} ${Math.abs(data.newBusiness.change).toFixed(1)}%
                            </span>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // 渲染流失预警
        function renderChurnWarning(data) {
            const container = document.getElementById('warningChurn');
            if (!container || !data) return;

            let html = '';

            // 高风险区域
            data.highRiskRegions.forEach(region => {
                html += `
                    <div class="warning-item high">
                        <div class="warning-title">
                            ${region.name}流失率异常
                        </div>
                        <div class="warning-content">
                            当前流失率 <span class="warning-value">${region.rate}%</span>，
                            上年均值 <span class="warning-value">${region.lastYearAvg}%</span>
                            <span class="warning-trend up">↑ ${(region.rate - region.lastYearAvg).toFixed(1)}%</span>
                        </div>
                    </div>
                `;
            });

            // 大客户流失
            data.largeCustomers.forEach(customer => {
                html += `
                    <div class="warning-item high">
                        <div class="warning-title">
                            大客户流失预警
                        </div>
                        <div class="warning-content">
                            ${customer.region} - ${customer.project}<br/>
                            合同金额 <span class="warning-value">${customer.amount}万元</span>
                        </div>
                    </div>
                `;
            });

            if (html === '') {
                html = `
                    <div class="warning-empty">
                        <span class
                `;
            }

            container.innerHTML = html;
        }

        // 渲染竞争对手预警
        function renderCompetitorWarning(data) {
            const container = document.getElementById('warningCompetitor');
            if (!container || !data) return;

            let html = '<div class="competitor-grid">';

            data.forEach((competitor) => {
                // 只显示排名有变化的机构
                if (competitor.rankChange !== 0) {
                    const rankChangeText = competitor.rankChange > 0 
                        ? `上升${competitor.rankChange}名` 
                        : `下降${Math.abs(competitor.rankChange)}名`;
                    const rankChangeClass = competitor.rankChange > 0 ? 'up' : 'down';
                    
                    html += `
                        <div class="warning-item ${competitor.trend === 'up' ? 'high' : 'info'}">
                            <div class="warning-title">
                                <span class="warning-rank">第${competitor.rank}名</span>
                                ${competitor.name}
                            </div>
                            <div class="warning-content">
                                有效证书数 <span class="warning-value">${competitor.certs.toLocaleString()}</span> 张
                                <span class="warning-trend ${competitor.trend === 'up' ? 'up' : 'down'}">
                                    ${competitor.trend === 'up' ? '↑' : '↓'} ${Math.abs(competitor.change).toLocaleString()}张
                                </span>
                            </div>
                            <div class="warning-rank-change">
                                上期排名：第${competitor.lastRank}名，<span class="warning-rank-change-text ${rankChangeClass}">${rankChangeText}</span>
                            </div>
                        </div>
                    `;
                }
            });

            html += '</div>';

            if (html === '<div class="competitor-grid"></div>') {
                html = `
                    <div class="warning-empty">
                        <span>头部机构排名无变化</span>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // 页面加载完成后初始化
        window.addEventListener('load', function() {
            generateDashboard();
            
            // 初始化时间切换 tabs
            setTimeout(() => {
                initTimeTabs();
            }, 500);
            
            // 窗口大小改变时重新调整图表
            window.addEventListener('resize', function() {
                Object.values(charts).forEach(chart => {
                    if (chart && chart.resize) chart.resize();
                });
            });
        });
        
        // ==================== AI助手功能 ====================
        
        // 发送消息
        function sendMessage() {
            const input = document.getElementById('aiInput');
            const message = input.value.trim();
            if (!message) return;
            
            // 添加用户消息
            addUserMessage(message);
            input.value = '';
            
            // 模拟AI回复
            setTimeout(() => {
                const response = generateAIResponse(message);
                addAIMessage(response);
            }, 500);
        }
        
        // 快捷提问
        function quickAsk(question) {
            addUserMessage(question);
            setTimeout(() => {
                const response = generateAIResponse(question);
                addAIMessage(response);
            }, 500);
        }
        
        // 添加用户消息
        function addUserMessage(message) {
            const chat = document.getElementById('aiChat');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'ai-message user-message';
            msgDiv.innerHTML = `
                <div class="ai-avatar" style="background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);">👤</div>
                <div class="ai-bubble user-bubble">${message}</div>
            `;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        }
        
        // 添加AI消息
        function addAIMessage(message) {
            const chat = document.getElementById('aiChat');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'ai-message';
            msgDiv.innerHTML = `
                <div class="ai-avatar">🤖</div>
                <div class="ai-bubble">${message}</div>
            `;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        }
        
        // 生成AI回复
        function generateAIResponse(message) {
            const responses = {
                '营业收入分析': '根据当前数据，认证线营业收入为<b>1,258.6亿元</b>，同比增长<b>12.5%</b>。<br/><br/>主要亮点：<br/>• 营业收入序时进度达90%，符合年度目标<br/>• 毛利润186.3亿元，利润率14.8%<br/>• 人均产出和人均利润均实现正增长<br/><br/>建议：继续加强高附加值业务拓展，提升整体盈利能力。',
                '市场全景解读': '当前市场全景显示：<br/><br/>• <b>国内企业总量</b>：5,280万家，同比增长5.2%<br/>• <b>管理体系有效证书</b>：368.5万张，增长8.5%<br/>• <b>管理体系获证组织</b>：98.5万家，增长7.2%<br/>• <b>服务认证</b>：28.6万张，增长15.8%（增速最快）<br/><br/>市场趋势：服务认证和新兴业务领域增长迅速，建议加大投入。',
                '资质能力评估': '当前资质能力状况：<br/><br/>• <b>国内资质</b>：55项，行业领先<br/>• <b>国际资质</b>：36项，持续扩展<br/>• <b>CNAS认可</b>：48项，认可范围广泛<br/>• <b>国际认可</b>：31项，国际互认度高<br/><br/>评估结论：资质体系完善，具备全品类认证服务能力。',
                '风险预警': '当前风险监控：<br/><br/>• <b>客户流失率</b>：3.8%，处于可控范围<br/>• <b>反馈数量</b>：156件，环比下降12%<br/>• <b>一次通过率</b>：94.5%，质量稳定<br/>• <b>发证周期</b>：12.5天，效率良好<br/><br/>预警：需关注新兴业务领域的审核员能力建设。',
                'default': '感谢您的提问！我已收到您关于"' + message + '"的问题。<br/><br/>基于当前驾驶舱数据，我可以为您提供：<br/>• 详细的数据分析与趋势解读<br/>• 业务洞察与决策建议<br/>• 风险预警与改进方案<br/><br/>请使用快捷按钮或输入具体问题，我将为您详细解答。'
            };
            
            return responses[message] || responses['default'];
        }
        
        // 回车发送
        document.getElementById('aiInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
