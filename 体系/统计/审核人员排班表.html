<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CQC审核人员排班计划表</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            --weekend-bg: #f0fdf4;
            --weekend-text: #166534;
            --holiday-bg: #fdf2f8;
            --holiday-text: #be185d;
            --hover-bg: #f8fafc;
            --selected-bg: #eff6ff;
            --audit-color: #3b82f6;
            --non-audit-color: #f59e0b;
            --leave-color: #ef4444;
            --external-color: #8b5cf6;
            --exceed-color: #dc2626;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-size: 13px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* 顶部查询栏 */
        .header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-content {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
        }

        select, input[type="text"] {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            background: var(--card-bg);
            color: var(--text-primary);
            transition: all 0.2s;
            min-width: 100px;
            height: 32px;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input[type="text"] {
            min-width: 160px;
            width: 160px;
        }

        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 32px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: white;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        /* 统计信息栏 */
        .stats-bar {
            margin-top: 65px;
            background: linear-gradient(to right, #eff6ff, #f0fdf4);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 32px;
            font-size: 13px;
            align-items: center;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 16px;
        }

        .stat-label {
            color: var(--text-secondary);
        }

        .stat-warning {
            margin-left: auto;
            color: var(--exceed-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 主体内容区 */
        .main-container {
            padding: 16px 20px;
            width: 100%;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .toolbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .legend {
            display: flex;
            gap: 20px;
            font-size: 12px;
            background: white;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        /* 排班表格容器 */
        .schedule-wrapper {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .schedule-container {
            overflow: auto;
            max-height: calc(100vh - 220px);
            position: relative;
        }

        /* 表格样式 */
        .schedule-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            min-width: max-content;
            table-layout: fixed;
        }

        /* 固定列 */
        .sticky-col {
            position: sticky;
            left: 0;
            background: var(--card-bg);
            z-index: 20;
            box-shadow: 2px 0 4px rgba(0,0,0,0.08);
        }

        .sticky-col.header {
            z-index: 30;
            background: #f8fafc;
        }

        /* 表头 */
        .schedule-table th {
            background: #f8fafc;
            padding: 10px 6px;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            border-right: 1px solid var(--border-light);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
            height: 60px;
        }

        .schedule-table th.date-header {
            min-width: 50px;
            max-width: 50px;
            cursor: pointer;
            transition: background 0.2s;
            padding: 6px 2px;
        }

        .schedule-table th.date-header:hover {
            background: var(--hover-bg);
        }

        .schedule-table th.date-header.weekend {
            background: #dcfce7;
            color: var(--weekend-text);
        }

        .schedule-table th.date-header.holiday {
            background: #fce7f3;
            color: var(--holiday-text);
        }

        .day-number {
            font-size: 14px;
            font-weight: 700;
            display: block;
            line-height: 1.2;
        }

        .day-week {
            font-size: 11px;
            opacity: 0.8;
            margin-top: 2px;
            display: block;
        }

        .holiday-name {
            font-size: 9px;
            font-weight: 600;
            margin-top: 2px;
            display: block;
        }

        /* 表格行 */
        .schedule-table tr {
            transition: background 0.15s;
        }

        .schedule-table tr:hover {
            background: var(--hover-bg);
        }

        .schedule-table tr.selected {
            background: var(--selected-bg);
        }

        .schedule-table td {
            padding: 0;
            border-bottom: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
            vertical-align: top;
            height: 50px;
            position: relative;
        }

        /* 人员信息列 */
        .person-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px 12px;
            height: 100%;
            justify-content: center;
        }

        .person-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .person-id {
            font-size: 11px;
            color: var(--text-muted);
            font-family: monospace;
        }

        .person-meta {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }

        .badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 500;
            white-space: nowrap;
        }

        .badge-primary {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-secondary {
            background: #f3f4f6;
            color: #4b5563;
        }

        .badge-exceed {
            background: #fee2e2;
            color: #991b1b;
            font-weight: 600;
        }

        /* 定额/月度天数列 */
        .days-cell {
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
            padding: 8px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .days-cell.exceed {
            color: var(--exceed-color);
            background: #fef2f2;
        }

        /* 排班单元格 */
        .schedule-cell {
            position: relative;
            height: 50px;
            min-width: 50px;
            max-width: 50px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .schedule-cell:hover {
            background: rgba(37, 99, 235, 0.04);
        }

        .schedule-cell.weekend {
            background: var(--weekend-bg);
        }

        .schedule-cell.holiday {
            background: var(--holiday-bg);
        }

        /* 任务条 */
        .task-bar {
            position: absolute;
            top: 2px;
            bottom: 2px;
            left: 2px;
            border-radius: 4px;
            font-size: 10px;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 3px 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            z-index: 5;
            line-height: 1.3;
            text-align: left;
        }

        .task-bar:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
            z-index: 15;
        }

        .task-bar.audit {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .task-bar.non-audit {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .task-bar.leave {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .task-bar.external {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        .task-company {
            font-weight: 600;
            font-size: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 1px;
        }

        .task-type {
            font-size: 9px;
            opacity: 0.95;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-days {
            font-size: 9px;
            opacity: 0.9;
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-remaining {
            font-size: 8px;
            opacity: 0.85;
            font-weight: 500;
        }

        /* 提示框 */
        .tooltip {
            position: fixed;
            background: rgba(15, 23, 42, 0.95);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            max-width: 360px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: var(--shadow-lg);
            line-height: 1.6;
            backdrop-filter: blur(4px);
        }

        .tooltip.visible {
            opacity: 1;
        }

        .tooltip-title {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 6px;
            color: #fbbf24;
        }

        .tooltip-row {
            display: flex;
            gap: 8px;
            margin: 4px 0;
        }

        .tooltip-label {
            color: #94a3b8;
            min-width: 70px;
            flex-shrink: 0;
            font-size: 11px;
        }

        .tooltip-value {
            color: white;
            font-weight: 500;
        }

        .tooltip-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }

        .tooltip-status.approved {
            background: #10b981;
            color: white;
        }

        .tooltip-status.non-audit {
            background: #f59e0b;
            color: white;
        }

        /* 编辑弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow: auto;
            transform: translateY(-20px);
            transition: transform 0.3s;
            box-shadow: var(--shadow-lg);
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border-radius: 12px 12px 0 0;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background: #f8fafc;
            border-radius: 0 0 12px 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .col-person { width: 120px; min-width: 120px; }
        .col-days { width: 70px; min-width: 70px; text-align: center; }
        .col-date { width: 50px; min-width: 50px; max-width: 50px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-title">
                <span style="font-size:20px;">📅</span> CQC审核人员排班计划表
            </div>

            <div class="filter-group">
                <label class="filter-label">年份</label>
                <select id="yearSelect">
                    <option value="2024">2024年</option>
                    <option value="2025">2025年</option>
                    <option value="2026" selected>2026年</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">月份</label>
                <select id="monthSelect">
                    <option value="0">1月</option>
                    <option value="1">2月</option>
                    <option value="2">3月</option>
                    <option value="3" selected>4月</option>
                    <option value="4">5月</option>
                    <option value="5">6月</option>
                    <option value="6">7月</option>
                    <option value="7">8月</option>
                    <option value="8">9月</option>
                    <option value="9">10月</option>
                    <option value="10">11月</option>
                    <option value="11">12月</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">在职类型</label>
                <select id="typeSelect">
                    <option value="all" selected>全部</option>
                    <option value="专职">专职</option>
                    <option value="兼职">兼职</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">月度限额</label>
                <select id="limitSelect">
                    <option value="all" selected>全部</option>
                    <option value="exceed">超过15天</option>
                    <option value="normal">未超过15天</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">人员查询</label>
                <input type="text" id="personSearch" placeholder="姓名/聘用号，多人用/分隔">
            </div>

            <div class="filter-group">
                <label class="filter-label">组织机构</label>
                <select id="orgSelect">
                    <option value="广州中心" selected>广州中心</option>
                    <option value="深圳中心">深圳中心</option>
                    <option value="东莞中心">东莞中心</option>
                </select>
            </div>

            <button class="btn btn-primary" onclick="querySchedule()">查询</button>
            <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-value" id="totalCount">0</span>
            <span class="stat-label">审核人员总数</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="scheduledCount">0</span>
            <span class="stat-label">已排班人员</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="fullTimeCount">0</span>
            <span class="stat-label">专职</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="partTimeCount">0</span>
            <span class="stat-label">兼职</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="exceedCount">0</span>
            <span class="stat-label">超限人员(>15天)</span>
        </div>
        <div class="stat-warning">⚠️ 红色表示月度累计超过15天</div>
    </div>

    <main class="main-container">
        <div class="toolbar">
            <div class="toolbar-left">
                <button class="btn btn-secondary" onclick="exportData()">导出Excel</button>
                <button class="btn btn-secondary" onclick="window.print()">打印</button>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--audit-color);"></div>
                    <span>已安排（已批准）</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--non-audit-color);"></div>
                    <span>休假/非审核活动</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--external-color);"></div>
                    <span>二方审核</span>
                </div>
            </div>
        </div>

        <div class="schedule-wrapper">
            <div class="schedule-container" id="scheduleContainer">
                <table class="schedule-table" id="scheduleTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="tooltip" id="tooltip"></div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">排班详情</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">审核人员</label>
                    <input type="text" class="form-input" id="modalPerson" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">日期</label>
                    <input type="text" class="form-input" id="modalDate" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">客户企业</label>
                    <input type="text" class="form-input" id="modalCompany" placeholder="输入企业名称">
                </div>
                <div class="form-group">
                    <label class="form-label">审核类型</label>
                    <select class="form-input" id="modalType">
                        <option value="初次认证">初次认证</option>
                        <option value="监督一">监督一</option>
                        <option value="监督二">监督二</option>
                        <option value="再认证">再认证</option>
                        <option value="非审核活动">非审核活动</option>
                        <option value="休假">休假</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">持续天数</label>
                    <input type="number" class="form-input" id="modalDays" placeholder="支持0.5天为单位" step="0.5" min="0.5" value="1">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveSchedule()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // 假数据
        const surnames = ['张','王','李','刘','陈','杨','黄','赵','周','吴','徐','孙','马','朱','胡','郭','何','高','林','罗'];
        const names = ['伟','芳','娜','敏','静','丽','强','磊','军','洋','勇','艳','杰','涛','明','超','秀','霞','平','刚'];
        const companies = ['广东电子','深圳制造','广州食品','东莞包装','佛山机械','惠州光学','珠海智能','中山医疗','江门化工','肇庆纺织','清远自动化','汕头精密'];
        const addresses = ['广州市天河区','深圳市南山区','东莞市松山湖','佛山市顺德区','惠州市仲恺区'];
        const auditTypes = ['初次认证','监督一','监督二','再认证'];
        const nonAuditTypes = ['年假','病假','调休','内部培训','外部培训','会议'];

        // 生成审核人员
        function generateAuditors() {
            const auditors = [];
            for (let i = 0; i < 30; i++) {
                const id = 'cqc' + String(Math.floor(Math.random() * 90000) + 10000).padStart(5, '0');
                const name = surnames[Math.floor(Math.random() * surnames.length)] + names[Math.floor(Math.random() * names.length)];
                const isFullTime = Math.random() > 0.3;
                const initialRemaining = 160 + Math.floor(Math.random() * 20);
                auditors.push({
                    id: id,
                    name: name,
                    type: isFullTime ? '专职' : '兼职',
                    initialRemaining: initialRemaining,
                    remainingDays: initialRemaining,
                    monthlyDays: 0,
                    plans: []
                });
            }
            return auditors;
        }

        // 生成排班计划
        function generatePlans(auditor, year, month) {
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const plans = [];
            let currentDay = 1;
            let remaining = auditor.initialRemaining;

            while (currentDay <= daysInMonth) {
                const date = new Date(year, month, currentDay);
                const weekDay = date.getDay();

                // 跳过周末
                if (weekDay === 0 || weekDay === 6) {
                    currentDay++;
                    continue;
                }

                // 随机安排任务（75%概率）
                if (Math.random() > 0.25) {
                    const isNonAudit = Math.random() > 0.85;
                    // 随机天数：0.5, 1, 1.5, 2, 2.5, 3
                    const durationOptions = [0.5, 1, 1, 1.5, 2, 2.5, 3];
                    const duration = durationOptions[Math.floor(Math.random() * durationOptions.length)];

                    const endDay = Math.min(currentDay + Math.ceil(duration) - 1, daysInMonth);

                    if (isNonAudit) {
                        const type = nonAuditTypes[Math.floor(Math.random() * nonAuditTypes.length)];
                        plans.push({
                            id: 'NA' + Math.random().toString(36).substr(2, 9),
                            companyName: type,
                            auditType: type,
                            isNonAudit: true,
                            days: duration,
                            startDay: currentDay,
                            endDay: endDay,
                            leader: auditor.name,
                            members: '',
                            address: '-',
                            remainingAtStart: remaining.toFixed(1),
                            status: 'non-audit'
                        });
                    } else {
                        const company = companies[Math.floor(Math.random() * companies.length)];
                        const type = auditTypes[Math.floor(Math.random() * auditTypes.length)];
                        const address = addresses[Math.floor(Math.random() * addresses.length)];
                        const isExternal = Math.random() > 0.92;

                        plans.push({
                            id: 'RZ' + Math.floor(Math.random() * 100000000),
                            companyName: company + '有限公司',
                            auditType: type,
                            isNonAudit: false,
                            isExternal: isExternal,
                            days: duration,
                            startDay: currentDay,
                            endDay: endDay,
                            leader: Math.random() > 0.5 ? auditor.name : surnames[Math.floor(Math.random() * surnames.length)] + names[Math.floor(Math.random() * names.length)],
                            members: Math.random() > 0.6 ? generateMembers() : '',
                            address: address,
                            remainingAtStart: remaining.toFixed(1),
                            status: 'approved'
                        });

                        remaining -= duration;
                    }

                    currentDay = endDay + 1;
                } else {
                    currentDay++;
                }
            }

            // 计算月度累计天数
            auditor.monthlyDays = plans.reduce((sum, p) => sum + parseFloat(p.days), 0);
            auditor.remainingDays = remaining;

            return plans;
        }

        function generateMembers() {
            const count = Math.floor(Math.random() * 2) + 1;
            const members = [];
            for (let i = 0; i < count; i++) {
                members.push(surnames[Math.floor(Math.random() * surnames.length)] + names[Math.floor(Math.random() * names.length)]);
            }
            return members.join('、');
        }

        // 初始化数据
        let scheduleData = generateAuditors();
        let currentData = [];
        let selectedRows = new Set();
        let currentEditing = null;

        // 节假日配置
        const holidays = {
            4: [{day: 4, name: "清明"}, {day: 5, name: "清明"}, {day: 6, name: "调休"}],
            5: [{day: 1, name: "劳动节"}, {day: 2, name: "劳动节"}, {day: 3, name: "劳动节"}],
            6: [{day: 22, name: "端午"}, {day: 23, name: "端午"}],
            10: [{day: 1, name: "国庆"}, {day: 2, name: "国庆"}, {day: 3, name: "国庆"}]
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始查询
            querySchedule();

            // 绑定自动刷新
            ['yearSelect', 'monthSelect', 'typeSelect', 'limitSelect'].forEach(id => {
                document.getElementById(id).addEventListener('change', querySchedule);
            });

            // 外部点击关闭弹窗
            document.getElementById('editModal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
        });

        // 查询排班
        function querySchedule() {
            const year = parseInt(document.getElementById('yearSelect').value) || 2026;
            const month = parseInt(document.getElementById('monthSelect').value) || 3;
            const type = document.getElementById('typeSelect').value || 'all';
            const limit = document.getElementById('limitSelect').value || 'all';
            const search = document.getElementById('personSearch').value.trim();

            // 为每个审核员生成该月的排班计划
            scheduleData.forEach(auditor => {
                auditor.plans = generatePlans(auditor, year, month);
            });

            // 过滤数据
            let filtered = scheduleData.filter(person => {
                // 在职类型筛选
                if (type !== 'all' && person.type !== type) return false;

                // 月度限额筛选
                if (limit === 'exceed' && person.monthlyDays <= 15) return false;
                if (limit === 'normal' && person.monthlyDays > 15) return false;

                // 人员搜索筛选
                if (search) {
                    const terms = search.split('/').map(s => s.trim()).filter(s => s);
                    if (terms.length > 0) {
                        const matchName = terms.some(t => person.name.includes(t));
                        const matchId = terms.some(t => person.id.toLowerCase().includes(t.toLowerCase()));
                        if (!matchName && !matchId) return false;
                    }
                }

                return true;
            });

            currentData = filtered;
            updateStats(filtered);
            renderSchedule(filtered, year, month);
        }

        // 重置筛选
        function resetFilter() {
            document.getElementById('typeSelect').value = 'all';
            document.getElementById('limitSelect').value = 'all';
            document.getElementById('personSearch').value = '';
            document.getElementById('orgSelect').value = '广州中心';
            querySchedule();
        }

        // 更新统计
        function updateStats(data) {
            document.getElementById('totalCount').textContent = data.length;
            document.getElementById('scheduledCount').textContent = data.filter(p => p.plans && p.plans.length > 0).length;
            document.getElementById('fullTimeCount').textContent = data.filter(p => p.type === '专职').length;
            document.getElementById('partTimeCount').textContent = data.filter(p => p.type === '兼职').length;
            document.getElementById('exceedCount').textContent = data.filter(p => p.monthlyDays > 15).length;
        }

        // 渲染排班表
        function renderSchedule(data, year, month) {
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            if (!data || data.length === 0) {
                document.getElementById('tableHead').innerHTML = '';
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="' + (daysInMonth + 2) + '" class="empty-state">暂无符合条件的数据</td></tr>';
                return;
            }

            renderHeader(daysInMonth, year, month);
            renderBody(data, daysInMonth, year, month);
        }

        // 渲染表头
        function renderHeader(days, year, month) {
            const thead = document.getElementById('tableHead');
            let html = '<tr>';

            html += '<th class="sticky-col header col-person">审核人员信息</th>';
            html += '<th class="sticky-col header col-days" >月度<br>天数</th>';

            for (let i = 1; i <= days; i++) {
                const date = new Date(year, month, i);
                const weekDay = date.getDay();
                const isWeekend = weekDay === 0 || weekDay === 6;
                const holiday = getHoliday(month + 1, i);
                const weekText = ['日','一','二','三','四','五','六'][weekDay];

                let className = 'date-header col-date';
                if (isWeekend) className += ' weekend';
                if (holiday) className += ' holiday';

                html += `<th class="${className}">
                    <span class="day-number">${i}</span>
                    <span class="day-week">${weekText}</span>
                    ${holiday ? `<span class="holiday-name">${holiday.name}</span>` : ''}
                </th>`;
            }

            html += '</tr>';
            thead.innerHTML = html;
        }

        function getHoliday(month, day) {
            if (holidays[month]) {
                return holidays[month].find(h => h.day === day);
            }
            return null;
        }

        // 渲染表格主体
        function renderBody(data, days, year, month) {
            const tbody = document.getElementById('tableBody');
            let html = '';

            data.forEach((person) => {
                const isExceed = person.monthlyDays > 15;
                html += `<tr id="row-${person.id}" onclick="toggleRow('${person.id}')">`;

                // 人员信息列
                html += `<td class="sticky-col col-person">
                    <div class="person-info">
                        <div class="person-name">
                            ${person.name}
                            ${person.type === '专职' ? '<span class="badge badge-primary">专职</span>' : '<span class="badge badge-secondary">兼职</span>'}
                        </div>
                        <div class="person-id">${person.id}</div>
                        <div class="person-meta">
                            <span style="font-size:10px;color:#64748b;">年度剩余: ${person.remainingDays.toFixed(1)}天</span>
                        </div>
                    </div>
                </td>`;

                // 月度天数列
                html += `<td class="sticky-col col-days ${isExceed ? 'exceed' : ''}" >
                    <div class="days-cell ${isExceed ? 'exceed' : ''}">
                        ${person.monthlyDays.toFixed(1)}
                        ${isExceed ? '<span style="font-size:9px;color:#dc2626;font-weight:600;">超限</span>' : ''}
                    </div>
                </td>`;

                // 每天的单元格
                const dayPlans = buildDayPlanMap(person.plans, days, year, month);

                for (let day = 1; day <= days; day++) {
                    const date = new Date(year, month, day);
                    const weekDay = date.getDay();
                    const isWeekend = weekDay === 0 || weekDay === 6;
                    const holiday = getHoliday(month + 1, day);
                    const plan = dayPlans[day];

                    let cellClass = 'schedule-cell col-date';
                    if (isWeekend) cellClass += ' weekend';
                    if (holiday) cellClass += ' holiday';

                    html += `<td class="${cellClass}" 
                        ondblclick="openPlanEditor('${person.id}', ${year}, ${month}, ${day}, event)"
                        onmouseenter="showTooltip(event, '${person.id}', ${day}, ${month}, ${year})"
                        onmouseleave="hideTooltip()">`;

                    // 渲染任务条
                    if (plan && plan.isStart) {
                        let barClass = 'task-bar';
                        if (plan.isNonAudit) {
                            barClass += ' leave';
                        } else if (plan.isExternal) {
                            barClass += ' external';
                        } else {
                            barClass += ' audit';
                        }

                        // 计算实际显示宽度（跨多少天）
                        let spanDays = calculateDisplaySpan(plan.startDay, plan.days, days, year, month);
                        let width = spanDays * 50 - 4;

                        const company = plan.companyName.length > 4 ? plan.companyName.substring(0, 4) + '...' : plan.companyName;

                        html += `<div class="${barClass}" style="width:${width}px;z-index:10;right:auto;"
                            onclick="showPlanDetail('${plan.id}', event)">
                            <div class="task-company" title="${plan.companyName}">${company}</div>
                            <div class="task-type">${plan.auditType}</div>
                            <div class="task-days">
                                <span>${plan.days}天</span>
                                <span class="task-remaining">剩${plan.remainingAtStart}</span>
                            </div>
                        </div>`;
                    }

                    html += '</td>';
                }

                html += '</tr>';
            });

            tbody.innerHTML = html;
        }

        // 构建每天的计划映射
        function buildDayPlanMap(plans, daysInMonth, year, month) {
            const dayMap = {};
            if (!plans || plans.length === 0) return dayMap;

            plans.forEach(plan => {
                const startDay = parseInt(plan.startDay);
                const len = parseFloat(plan.days);
                let daysAssigned = 0;

                for (let d = 0; d < len && (startDay + d) <= daysInMonth; d++) {
                    const currentDay = startDay + d;
                    const date = new Date(year, month, currentDay);
                    const weekDay = date.getDay();

                    // 跳过周末和节假日
                    if (weekDay === 0 || weekDay === 6) continue;
                    if (getHoliday(month + 1, currentDay)) continue;

                    dayMap[currentDay] = {
                        ...plan,
                        isStart: daysAssigned === 0,
                        displayIndex: d
                    };
                    daysAssigned++;
                }
            });

            return dayMap;
        }

        // 计算显示跨度（考虑周末和节假日截断）
        function calculateDisplaySpan(startDay, totalDays, daysInMonth, year, month) {
            let span = 0;
            let daysCounted = 0;
            let currentDay = startDay;

            while (daysCounted < totalDays && currentDay <= daysInMonth) {
                const date = new Date(year, month, currentDay);
                const weekDay = date.getDay();
                const isWeekend = weekDay === 0 || weekDay === 6;
                const holiday = getHoliday(month + 1, currentDay);

                if (!isWeekend && !holiday) {
                    daysCounted++;
                }
                span++;
                currentDay++;
            }

            return Math.max(span, 1);
        }

        // 切换行选中
        function toggleRow(id) {
            const row = document.getElementById(`row-${id}`);
            if (selectedRows.has(id)) {
                selectedRows.delete(id);
                row.classList.remove('selected');
            } else {
                selectedRows.add(id);
                row.classList.add('selected');
            }
        }

        // 显示提示框
        function showTooltip(e, personId, day, month, year) {
            const person = currentData.find(p => p.id === personId);
            if (!person) return;

            const dayPlans = buildDayPlanMap(person.plans, 31, year, month);
            const plan = dayPlans[day];

            if (!plan) return;

            const tooltip = document.getElementById('tooltip');
            const isNonAudit = plan.isNonAudit;

            let content = `<div class="tooltip-title">${plan.companyName}</div>`;

            content += `
                <div class="tooltip-row">
                    <span class="tooltip-label">审核人员:</span>
                    <span class="tooltip-value">${person.name} (${person.id})</span>
                </div>
                <div class="tooltip-row">
                    <span class="tooltip-label">计划时间:</span>
                    <span class="tooltip-value">${month+1}月${plan.startDay}日 - ${month+1}月${plan.endDay}日</span>
                </div>
                <div class="tooltip-row">
                    <span class="tooltip-label">占用天数:</span>
                    <span class="tooltip-value">${plan.days}天</span>
                </div>
            `;

            if (!isNonAudit) {
                content += `
                    <div class="tooltip-row">
                        <span class="tooltip-label">审核类型:</span>
                        <span class="tooltip-value">${plan.auditType}</span>
                    </div>
                    <div class="tooltip-row">
                        <span class="tooltip-label">公司地址:</span>
                        <span class="tooltip-value">${plan.address || '-'}</span>
                    </div>
                    <div class="tooltip-row">
                        <span class="tooltip-label">审核组长:</span>
                        <span class="tooltip-value">${plan.leader || '-'}</span>
                    </div>
                    ${plan.members ? `
                    <div class="tooltip-row">
                        <span class="tooltip-label">审核组员:</span>
                        <span class="tooltip-value">${plan.members}</span>
                    </div>` : ''}
                    <div class="tooltip-row">
                        <span class="tooltip-label">项目剩余:</span>
                        <span class="tooltip-value">${plan.remainingAtStart}天</span>
                    </div>
                    <div style="margin-top:8px;">
                        <span class="tooltip-status approved">已安排（已批准）</span>
                    </div>
                `;
            } else {
                content += `
                    <div class="tooltip-row">
                        <span class="tooltip-label">活动类型:</span>
                        <span class="tooltip-value">${plan.nonAuditType || plan.auditType}</span>
                    </div>
                    <div class="tooltip-row">
                        <span class="tooltip-label">剩余可用:</span>
                        <span class="tooltip-value">${plan.remainingAtStart}天</span>
                    </div>
                    <div style="margin-top:8px;">
                        <span class="tooltip-status non-audit">非审核活动</span>
                    </div>
                `;
            }

            tooltip.innerHTML = content;
            tooltip.classList.add('visible');

            const rect = e.target.getBoundingClientRect();
            let left = rect.right + 10;
            let top = rect.top;

            if (left + 360 > window.innerWidth) {
                left = rect.left - 370;
            }
            if (top + 300 > window.innerHeight) {
                top = window.innerHeight - 310;
            }

            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        function hideTooltip() {
            document.getElementById('tooltip').classList.remove('visible');
        }

        // 打开编辑器
        function openPlanEditor(personId, year, month, day, event) {
            event.stopPropagation();
            const person = currentData.find(p => p.id === personId);
            if (!person) return;

            document.getElementById('modalPerson').value = `${person.name} (${person.id})`;
            document.getElementById('modalDate').value = `${year}年${month+1}月${day}日`;

            currentEditing = { personId, year, month, day };
            document.getElementById('editModal').classList.add('active');
        }

        function showPlanDetail(planId, event) {
            event.stopPropagation();
            console.log('Plan ID:', planId);
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
            currentEditing = null;
        }

        function saveSchedule() {
            if (!currentEditing) return;

            const company = document.getElementById('modalCompany').value;
            const type = document.getElementById('modalType').value;
            const days = parseFloat(document.getElementById('modalDays').value);

            if (!company) {
                alert('请输入客户企业名称');
                return;
            }

            console.log('保存:', { ...currentEditing, company, type, days });
            alert('排班信息已保存！');
            closeModal();
            querySchedule();
        }

        // 导出数据
        function exportData() {
            const year = document.getElementById('yearSelect').value;
            const month = parseInt(document.getElementById('monthSelect').value) + 1;

            let csv = '﻿审核员编号,姓名,类型,初始剩余天数,月度累计天数,最终剩余天数\n';

            currentData.forEach(person => {
                csv += `${person.id},${person.name},${person.type},${person.initialRemaining},${person.monthlyDays.toFixed(1)},${person.remainingDays.toFixed(1)}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `CQC排班表_${year}_${month}.csv`;
            link.click();
        }
    </script>
</body>
</html>
