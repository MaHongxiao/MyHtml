<style>
  :root {
    --primary: #1890ff;
    --primary-light: #e6f7ff;
    --primary-hover: #40a9ff;
    --sidebar-bg: #001529;
    --success: #52c41a;
    --success-bg: #f6ffed;
    --warning: #fa8c16;
    --warning-bg: #fff7e6;
    --danger: #f5222d;
    --danger-bg: #fff2f0;
    --info: #1890ff;
    --info-bg: #e6f7ff;
    --purple: #722ed1;
    --purple-bg: #f9f0ff;
    --bg-page: #f0f2f5;
    --bg-card: #ffffff;
    --border: #e8e8e8;
    --border-light: #f0f0f0;
    --text-primary: #262626;
    --text-secondary: #595959;
    --text-placeholder: #bfbfbf;
    --text-disabled: #8c8c8c;
    --shadow-card: 0 2px 8px rgba(0,0,0,0.08);
    --radius: 4px;
    --radius-lg: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px; color: var(--text-primary); background: var(--bg-page); line-height: 1.6;
    overflow: hidden; height: 100vh;
  }
  .layout { display: flex; height: 100vh; }

  /* ========== Sidebar ========== */
  .sidebar {
    width: 64px; min-width: 64px; background: var(--sidebar-bg);
    display: flex; flex-direction: column; align-items: center;
    padding-top: 8px; position: relative; z-index: 100;
  }
  .sidebar-logo {
    width: 40px; height: 40px; border-radius: 8px; background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; margin-bottom: 12px;
  }
  .sidebar-menu { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; padding: 4px 0; }
  .menu-item {
    width: 52px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.65); cursor: pointer; transition: all 0.2s;
    border-radius: 8px; text-decoration: none; position: relative; gap: 2px;
  }
  .menu-item .menu-icon { font-size: 18px; line-height: 1; }
  .menu-item .menu-label { font-size: 10px; line-height: 1; white-space: nowrap; }
  .menu-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
  .menu-item.active { color: #fff; background: var(--primary); }
  .menu-item.active::before {
    content: ''; position: absolute; left: 0; top: 10px; bottom: 10px;
    width: 3px; background: #fff; border-radius: 0 2px 2px 0;
  }

  /* ========== Submenu ========== */
  .submenu-wrapper { position: relative; }
  .submenu {
    display: none; position: absolute; left: 64px; top: 0;
    background: var(--bg-card); border-radius: var(--radius-lg);
    box-shadow: 0 6px 16px rgba(0,0,0,0.12), 0 0 1px rgba(0,0,0,0.08);
    min-width: 200px; padding: 8px 0; z-index: 200;
    border: 1px solid var(--border-light);
  }
  .submenu::before {
    content: ''; position: absolute; left: -16px; top: 0; bottom: 0; width: 16px;
  }
  .submenu-wrapper:hover .submenu,
  .submenu.open { display: block; }
  .submenu-item {
    display: flex; align-items: center; height: 36px; padding: 0 12px;
    color: var(--text-primary); cursor: pointer; transition: all 0.15s;
    font-size: 13px; border-radius: var(--radius); margin: 1px 0;
    text-decoration: none; white-space: nowrap;
  }
  .submenu-item:hover { background: var(--primary-light); color: var(--primary); }
  .submenu-item.active { color: var(--primary); font-weight: 500; background: var(--primary-light); }
  .submenu-item .sub-dot {
    width: 4px; height: 4px; border-radius: 50%; background: var(--border);
    margin-right: 10px; flex-shrink: 0;
  }
  .submenu-item:hover .sub-dot, .submenu-item.active .sub-dot { background: var(--primary); }

  /* ========== Main ========== */
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ========== Header ========== */
  .header {
    height: 56px; background: var(--bg-card); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-title { font-size: 16px; font-weight: 500; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-user { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .header-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--primary);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px;
  }

  /* ========== Page ========== */
  .page-content { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .page-content::-webkit-scrollbar { width: 6px; }
  .page-content::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 3px; }

  /* ========== Page Header ========== */
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .page-title-group { display: flex; align-items: center; gap: 12px; }
  .page-title { font-size: 20px; font-weight: 600; }
  .btn-back {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--text-secondary); cursor: pointer; font-size: 14px;
    background: none; border: none; font-family: inherit; padding: 4px 0;
  }
  .btn-back:hover { color: var(--primary); }

  /* ========== Buttons ========== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 32px; padding: 0 16px; border-radius: var(--radius);
    font-size: 14px; cursor: pointer; transition: all 0.2s;
    border: 1px solid transparent; gap: 6px; white-space: nowrap; font-family: inherit;
  }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-default { background: var(--bg-card); color: var(--text-primary); border-color: var(--border); }
  .btn-default:hover { border-color: var(--primary); color: var(--primary); }
  .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
  .btn-success:hover { background: #389e0d; }

  /* ========== Card ========== */
  .card {
    background: var(--bg-card); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card); margin-bottom: 12px; overflow: hidden;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; border-bottom: 1px solid var(--border-light);
  }
  .card-title { font-size: 15px; font-weight: 600; }
  .card-body { padding: 16px 24px; }

  /* ========== Notice Document ========== */
  .notice-wrapper {
    max-width: 820px;
    margin: 0 auto;
    padding: 50px 60px;
    background: #e8f4f8;
    border: 3px solid #4a9b9b;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    position: relative;
    font-family: "SimSun", "宋体", "Songti SC", serif;
  }
  /* 四角装饰 */
  .notice-wrapper::before,
  .notice-wrapper::after {
    content: '';
    position: absolute;
    width: 60px;
    height: 60px;
    border: 3px solid #4a9b9b;
  }
  .notice-wrapper::before {
    top: 6px; left: 6px;
    border-right: none; border-bottom: none;
    border-radius: 8px 0 0 0;
  }
  .notice-wrapper::after {
    bottom: 6px; right: 6px;
    border-left: none; border-top: none;
    border-radius: 0 0 8px 0;
  }
  .corner-tr, .corner-bl {
    position: absolute;
    width: 60px;
    height: 60px;
    border: 3px solid #4a9b9b;
  }
  .corner-tr {
    top: 6px; right: 6px;
    border-left: none; border-bottom: none;
    border-radius: 0 8px 0 0;
  }
  .corner-bl {
    bottom: 6px; left: 6px;
    border-right: none; border-top: none;
    border-radius: 0 0 0 8px;
  }
  .notice-logo {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0066cc, #004c99);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    margin: 0 auto 20px;
    box-shadow: 0 2px 8px rgba(0,102,204,0.3);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .notice-doc-no {
    text-align: right;
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }
  .notice-title {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 30px;
    color: var(--text-primary);
  }
  .notice-recipient {
    font-size: 15px;
    margin-bottom: 20px;
    color: var(--text-primary);
  }
  .notice-body {
    font-size: 15px;
    line-height: 2;
    text-indent: 2em;
    color: var(--text-primary);
  }
  .notice-body p {
    margin-bottom: 16px;
  }
  .notice-signature {
    text-align: right;
    margin-top: 40px;
    font-size: 15px;
    line-height: 2;
    color: var(--text-primary);
  }
  .notice-signature .org-en {
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* ========== Footer ========== */
  .footer-actions {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 12px 24px; background: var(--bg-card);
    border-top: 1px solid var(--border);
    position: sticky; bottom: 0; z-index: 10;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
    flex-shrink: 0;
  }

  /* ========== Animations ========== */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .animate-in { animation: fadeIn 0.3s ease-out forwards; }
</style>
<script>
function toggleSubmenu(e, el) {
  e.preventDefault();
  e.stopPropagation();
  var wrapper = el.closest('.submenu-wrapper');
  var submenu = wrapper.querySelector('.submenu');
  var isOpen = submenu.classList.contains('open');
  document.querySelectorAll('.submenu.open').forEach(function(m) { m.classList.remove('open'); });
  document.querySelectorAll('.menu-item.active').forEach(function(m) { m.classList.remove('active'); });
  if (!isOpen) {
    submenu.classList.add('open');
    el.classList.add('active');
  }
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.submenu-wrapper')) {
    document.querySelectorAll('.submenu.open').forEach(function(m) { m.classList.remove('open'); });
  }
});

function goBack() {
  window.location.href = 'cert-recovery-list.html';
}

function enlargeFont() {
  var body = document.querySelector('.notice-wrapper');
  var currentSize = parseFloat(window.getComputedStyle(body).fontSize);
  body.style.fontSize = (currentSize + 2) + 'px';
}

function shrinkFont() {
  var body = document.querySelector('.notice-wrapper');
  var currentSize = parseFloat(window.getComputedStyle(body).fontSize);
  if (currentSize > 12) {
    body.style.fontSize = (currentSize - 2) + 'px';
  }
}

function generateNotice() {
  alert('电子通知书已生成！');
}

window.addEventListener('DOMContentLoaded', function() {
  // 初始化完成
});
</script>
