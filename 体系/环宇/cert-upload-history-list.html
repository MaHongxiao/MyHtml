<style>
  :root {
    --primary: #1890ff;
    --primary-light: #e6f7ff;
    --primary-hover: #40a9ff;
    --sidebar-bg: #001529;
    --success: #52c41a;
    --success-bg: #f6ffed;
    --warning: #fa8c16;
    --warning-bg: #fff7e6;
    --danger: #f5222d;
    --danger-bg: #fff2f0;
    --info: #1890ff;
    --info-bg: #e6f7ff;
    --purple: #722ed1;
    --purple-bg: #f9f0ff;
    --bg-page: #f0f2f5;
    --bg-card: #ffffff;
    --border: #e8e8e8;
    --border-light: #f0f0f0;
    --text-primary: #262626;
    --text-secondary: #595959;
    --text-placeholder: #bfbfbf;
    --text-disabled: #8c8c8c;
    --shadow-card: 0 2px 8px rgba(0,0,0,0.08);
    --radius: 4px;
    --radius-lg: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px; color: var(--text-primary); background: var(--bg-page); line-height: 1.6;
    overflow: hidden; height: 100vh;
  }
  .layout { display: flex; height: 100vh; }

  /* ========== Sidebar ========== */
  .sidebar {
    width: 64px; min-width: 64px; background: var(--sidebar-bg);
    display: flex; flex-direction: column; align-items: center;
    padding-top: 8px; position: relative; z-index: 100;
  }
  .sidebar-logo {
    width: 40px; height: 40px; border-radius: 8px; background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; margin-bottom: 12px;
  }
  .sidebar-menu { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; padding: 4px 0; }
  .menu-item {
    width: 52px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.65); cursor: pointer; transition: all 0.2s;
    border-radius: 8px; text-decoration: none; position: relative; gap: 2px;
  }
  .menu-item .menu-icon { font-size: 18px; line-height: 1; }
  .menu-item .menu-label { font-size: 10px; line-height: 1; white-space: nowrap; }
  .menu-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
  .menu-item.active { color: #fff; background: var(--primary); }
  .menu-item.active::before {
    content: ''; position: absolute; left: 0; top: 10px; bottom: 10px;
    width: 3px; background: #fff; border-radius: 0 2px 2px 0;
  }

  /* ========== Submenu ========== */
  .submenu-wrapper { position: relative; }
  .submenu {
    display: none; position: absolute; left: 64px; top: 0;
    background: var(--bg-card); border-radius: var(--radius-lg);
    box-shadow: 0 6px 16px rgba(0,0,0,0.12), 0 0 1px rgba(0,0,0,0.08);
    min-width: 200px; padding: 8px 0; z-index: 200;
    border: 1px solid var(--border-light);
  }
  .submenu::before {
    content: ''; position: absolute; left: -16px; top: 0; bottom: 0; width: 16px;
  }
  .submenu-wrapper:hover .submenu,
  .submenu.open { display: block; }
  .submenu-item {
    display: flex; align-items: center; height: 36px; padding: 0 12px;
    color: var(--text-primary); cursor: pointer; transition: all 0.15s;
    font-size: 13px; border-radius: var(--radius); margin: 1px 0;
    text-decoration: none; white-space: nowrap;
  }
  .submenu-item:hover { background: var(--primary-light); color: var(--primary); }
  .submenu-item.active { color: var(--primary); font-weight: 500; background: var(--primary-light); }
  .submenu-item .sub-dot {
    width: 4px; height: 4px; border-radius: 50%; background: var(--border);
    margin-right: 10px; flex-shrink: 0;
  }
  .submenu-item:hover .sub-dot, .submenu-item.active .sub-dot { background: var(--primary); }

  /* ========== Main ========== */
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ========== Header ========== */
  .header {
    height: 56px; background: var(--bg-card); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-title { font-size: 16px; font-weight: 500; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-user { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .header-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--primary);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500;
  }

  /* ========== Page ========== */
  .page-content { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .page-content::-webkit-scrollbar { width: 6px; }
  .page-content::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 3px; }

  /* ========== Buttons ========== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 32px; padding: 0 16px; border-radius: var(--radius);
    font-size: 14px; cursor: pointer; transition: all 0.2s;
    border: 1px solid transparent; gap: 6px; white-space: nowrap; font-family: inherit;
  }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-default { background: var(--bg-card); color: var(--text-primary); border-color: var(--border); }
  .btn-default:hover { border-color: var(--primary); color: var(--primary); }
  .btn-text { background: transparent; color: var(--primary); border: none; padding: 0 8px; height: auto; font-size: 13px; }
  .btn-text:hover { color: var(--primary-hover); }
  .btn-sm { height: 28px; padding: 0 12px; font-size: 13px; }
  .btn-back {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--primary); cursor: pointer; font-size: 14px;
    text-decoration: none; transition: color 0.2s;
  }
  .btn-back:hover { color: var(--primary-hover); }

  /* ========== Table Card ========== */
  .table-card {
    background: var(--bg-card); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card); overflow: hidden; display: flex; flex-direction: column;
  }
  .table-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--border-light); flex-shrink: 0;
  }
  .table-toolbar-left { display: flex; align-items: center; gap: 12px; }
  .table-toolbar-right { display: flex; align-items: center; gap: 8px; }

  /* ========== Table Container ========== */
  .table-container { flex: 1; overflow: auto; position: relative; }
  .table-container::-webkit-scrollbar { height: 8px; width: 8px; }
  .table-container::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 4px; }
  .table-container::-webkit-scrollbar-corner { background: #f5f5f5; }

  /* ========== Table ========== */
  .data-table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; }
  .data-table thead th {
    background: #fafafa; padding: 12px 16px; text-align: left;
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    border-bottom: 1px solid var(--border); white-space: nowrap;
    position: sticky; top: 0; z-index: 10;
  }
  .data-table tbody tr { border-bottom: 1px solid var(--border-light); transition: background 0.15s; }
  .data-table tbody tr:hover { background: #fafbfc; }
  .data-table tbody td { padding: 14px 16px; font-size: 14px; vertical-align: middle; white-space: nowrap; }
  .data-table .link { color: var(--primary); cursor: pointer; text-decoration: none; }
  .data-table .link:hover { text-decoration: underline; }

  /* ========== Tags ========== */
  .tag {
    display: inline-flex; align-items: center; height: 22px; padding: 0 8px;
    border-radius: 4px; font-size: 12px; font-weight: 500; line-height: 1;
  }
  .tag-info { background: var(--info-bg); color: var(--info); }
  .tag-success { background: var(--success-bg); color: var(--success); }
  .tag-warning { background: var(--warning-bg); color: var(--warning); }
  .tag-danger { background: var(--danger-bg); color: var(--danger); }
  .tag-purple { background: var(--purple-bg); color: var(--purple); }
  .tag-default { background: #f5f5f5; color: var(--text-secondary); }

  /* ========== Pagination ========== */
  .pagination-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-top: 1px solid var(--border-light); flex-shrink: 0;
  }
  .pagination-info { font-size: 13px; color: var(--text-secondary); }
  .pagination { display: flex; align-items: center; gap: 4px; }
  .page-btn {
    min-width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card);
    color: var(--text-primary); font-size: 13px; cursor: pointer; transition: all 0.2s;
    padding: 0 8px; font-family: inherit;
  }
  .page-btn:hover { border-color: var(--primary); color: var(--primary); }
  .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .page-btn:disabled { color: var(--text-placeholder); cursor: not-allowed; }

  /* ========== Animations ========== */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .animate-in { animation: fadeIn 0.3s ease-out forwards; }
</style>
<script>
  function toggleSubmenu(e, el) {
    e.preventDefault();
    e.stopPropagation();
    var wrapper = el.closest('.submenu-wrapper');
    var submenu = wrapper.querySelector('.submenu');
    var isOpen = submenu.classList.contains('open');
    document.querySelectorAll('.submenu.open').forEach(function(m) { m.classList.remove('open'); });
    document.querySelectorAll('.menu-item.active').forEach(function(m) { m.classList.remove('active'); });
    if (!isOpen) {
      submenu.classList.add('open');
      el.classList.add('active');
    }
  }
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.submenu-wrapper')) {
      document.querySelectorAll('.submenu.open').forEach(function(m) { m.classList.remove('open'); });
    }
  });

  // ========== 数据 ==========

    { id: 5, fileName: '2026F23672R_广东健力宝_ISO22000_证书文件.zip', fileSize: '1.5MB', uploadTime: '2026-04-16 16:40:12', status: '上传成功100%' },
    { id: 6, fileName: '2026Q37242R_北京国资环保_ISO9001_证书文件.zip', fileSize: '2.7MB', uploadTime: '2026-04-15 11:20:45', status: '上传成功100%' },
    { id: 7, fileName: '2026E33235R_北京富润成_ISO14001_证书文件.zip', fileSize: '1.9MB', uploadTime: '2026-04-15 11:15:30', status: '上传成功100%' },
    { id: 8, fileName: '2026S33615R_国网商用大数据_ISO45001_证书文件.zip', fileSize: '3.5MB', uploadTime: '2026-04-14 09:50:18', status: '上传成功100%' },
    { id: 9, fileName: '2026S31610R_北京笔中文化_ISO45001_证书文件.zip', fileSize: '2.1MB', uploadTime: '2026-04-14 09:45:00', status: '上传中 67%' },
    { id: 10, fileName: '2026En20430R_黑龙江农垦龙王_能源管理体系_证书文件.zip', fileSize: '4.8MB', uploadTime: '2026-04-13 15:30:00', status: '上传中 35%' }
  ];

  // ========== 状态Tag ==========
  function getStatusTag(status) {
    if (status.indexOf('上传成功') !== -1) {
      return '<span class="tag tag-success">' + status + '</span>';
    }
    if (status.indexOf('上传中') !== -1) {
      return '<span class="tag tag-warning">' + status + '</span>';
    }
    return '<span class="tag tag-default">' + status + '</span>';
  }

  // ========== 渲染表格 ==========
  function renderTable(data) {
    var tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    data.forEach(function(item, index) {
      var row = document.createElement('tr');
      row.innerHTML =
        '<td>' + (index + 1) + '</td>' +
        '<td style="white-space:normal;max-width:500px;word-break:break-all;">' + item.fileName + '</td>' +
        '<td>' + item.fileSize + '</td>' +
        '<td>' + item.uploadTime + '</td>' +
        '<td>' + getStatusTag(item.status) + '</td>' +
        '<td><a class="link" href="javascript:void(0)" onclick="downloadFile(' + item.id + ')">下载</a></td>';
      tbody.appendChild(row);
    });
    document.querySelector('.table-toolbar-left span').textContent = '共 ' + data.length + ' 条记录';
    document.querySelector('.pagination-info span').textContent = '共 ' + data.length + ' 条记录';
  }

  // ========== 下载文件 ==========
  function downloadFile(id) {
    alert("正在下载文件...");
  }

  // ========== 返回列表 ==========
  function goBack() {
    window.location.href = 'cert-upload-manage-list.html';
  }

  // ========== 初始化 ==========
  document.addEventListener('DOMContentLoaded', function() {
    renderTable(tableData);
  });
</script>
